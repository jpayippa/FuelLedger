<header>
  <div class="title-block">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 9V4a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v16h9"/>
        <path d="M9 15h1"/>
        <path d="M14 9h3l2.5 2.5V18a1 1 0 0 1-1 1H17"/>
        <path d="M14 12h3"/>
        <circle cx="17" cy="18.5" r="1"/>
      </svg>
    </div>
    <div>
      <h1>{{ header_title or "FuelLedger" }}</h1>
      {% if header_subtitle %}<div class="subtitle">{{ header_subtitle }}</div>{% endif %}
    </div>
  </div>
  <div class="nav-links">
    <a class="nav-link {{ 'active' if active_page == 'home' }}" href="/">Home</a>
    <a class="nav-link {{ 'active' if active_page == 'analytics' }}" href="/analytics">Analytics</a>
    <a class="nav-link {{ 'active' if active_page == 'vehicles' }}" href="/vehicles">Manage</a>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
  </div>
</header>
